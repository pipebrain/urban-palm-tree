name: Deploy GitHub Pages
run-name: Publish M0 preview from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag, or branch to publish
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the source and application
        run: |
          pnpm data:check
          pnpm test
          pnpm format:check
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the complete offline preview
        env:
          APP_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build
      - name: Record the selected source revision
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          node -e 'const fs = require("node:fs"); const files = fs.readdirSync("dist/assets"); if (!files.some(f => f.includes("worker"))) throw new Error("Missing layout worker"); if (!fs.existsSync("dist/data/qudt-graph.json") || !fs.existsSync("dist/sw.js")) throw new Error("Missing complete offline baseline");'
      - name: Upload the static app
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
